name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare exact supplied launcher image
        run: |
          rm -f app/src/main/res/drawable-nodpi/icon_custom_base64.txt
          base64 -d -i build-assets/icon_custom_base64.txt > app/src/main/res/drawable-nodpi/ic_launcher_exact.png
          file app/src/main/res/drawable-nodpi/ic_launcher_exact.png
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScreenOrientation-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
